# Uppity Spinner ALT v4 — pinned build profile.
#
# Why this file exists: Arduino IDE 2.x can silently drop Tools-menu options when the
# board is re-detected on a port change (Sabé and Roam-A-Dome ALT both hit this). With
# this file the options live in the repo:
#   IDE 2.3+  — pick "uppity" from the profile dropdown next to the board selector.
#   CLI       — arduino-cli compile --profile uppity UppityFirmware
#               arduino-cli upload  --profile uppity -p /dev/cu.usbserial-XXXX UppityFirmware
#
# Every value is load-bearing:
#   PartitionScheme=min_spiffs  two 1.9 MB app slots (OTA-capable) instead of the default
#                               1.3 MB that v3 filled to 94 %. Changing the scheme is why the
#                               v3 → v4 upgrade needs one USB flash.
#   FlashSize=4M                the Uppity Spinner PCB's WROOM-32 module.
#   UploadSpeed=921600          fine on the CP2102/CH340 USB bridge; drop to 115200 if it fails.
profiles:
  uppity:
    notes: Uppity Spinner PCB, ESP32-WROOM-32, standard (non-SD) board variant.
    fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashSize=4M,UploadSpeed=921600
    platforms:
      - platform: esp32:esp32 (3.3.4)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

default_profile: uppity
